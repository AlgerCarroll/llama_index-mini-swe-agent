name: Build Package

# Build package on its own without additional pip install

on:
  push:
    branches:
      - main
  pull_request:


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package distributions
        run: python -m build

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install built wheel
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_exe=".venv/Scripts/python.exe"
          else
            python_exe=".venv/bin/python"
          fi
          "$python_exe" -m pip install dist/*.whl

      - name: Verify top-level package import
        working-directory: ${{ env.RUNNER_TEMP }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_exe="$GITHUB_WORKSPACE/.venv/Scripts/python.exe"
          else
            python_exe="$GITHUB_WORKSPACE/.venv/bin/python"
          fi
          "$python_exe" -c "import llama_index"
